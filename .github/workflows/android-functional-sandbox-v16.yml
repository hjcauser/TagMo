name: Android Sandbox Functional APK 1.6
on:
  push:
    branches: [sandbox/android-functional-v1.6]
    paths:
      - 'sandbox-android/**'
      - '.github/workflows/android-functional-sandbox-v16.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check SDK installed by GitHub runner
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is missing}"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          java -version
          gradle --version
      - name: Compile Android Java and produce signed debug APK
        working-directory: sandbox-android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Check artifact format and checksum
        run: |
          set -euo pipefail
          apk=sandbox-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk"
          unzip -l "$apk" | grep -E 'classes.dex|AndroidManifest.xml'
          sha256sum "$apk" | tee sandbox-functional-apk-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-functional-v1.6-debug-apk
          path: |
            sandbox-android/app/build/outputs/apk/debug/app-debug.apk
            sandbox-functional-apk-SHA256SUMS.txt
          retention-days: 14

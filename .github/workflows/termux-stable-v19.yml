name: Termux stable v0.118.3 pinned Android build (sandbox v1.9)

on:
  push:
    branches: [sandbox/termux-stable-v1.9]
    paths:
      - '.github/workflows/termux-stable-v19.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  termux-android-7:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out immutable official Termux source
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: 5b657c6adf4304e5198951ce815fe0205dcac29c
          path: upstream
          persist-credentials: false

      - name: Verify provenance and the upstream build toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = '5b657c6adf4304e5198951ce815fe0205dcac29c'
          test -z "$(git -C upstream status --porcelain)"
          grep -F 'gradle-7.2-all.zip' upstream/gradle/wrapper/gradle-wrapper.properties
          grep -F "classpath 'com.android.tools.build:gradle:4.2.2'" upstream/build.gradle
          grep -F 'ndkVersion=22.1.7171670' upstream/gradle.properties
          grep -F 'compileSdkVersion=30' upstream/gradle.properties
          grep -F 'versionName "0.118.3"' upstream/app/build.gradle

      - name: Set up official Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install original Android SDK, build-tools and NDK versions
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-30' 'build-tools;30.0.3' 'ndk;22.1.7171670'
          test -s "$ANDROID_HOME/platforms/android-30/android.jar"
          test -x "$ANDROID_HOME/build-tools/30.0.3/apksigner"
          test -d "$ANDROID_HOME/ndk/22.1.7171670"
          java -version

      - name: Set up Java 11 for Gradle 7.2 and Android Gradle Plugin 4.2.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build unmodified pinned source with checked bootstrap checksums
        shell: bash
        env:
          TERMUX_APP_VERSION_NAME: '0.118.3'
          TERMUX_APK_VERSION_TAG: 'v0.118.3-apt-android-7-sandbox-debug'
        run: |
          set -euo pipefail
          cd upstream
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleDebug --stacktrace

      - name: Validate APKs, signatures, manifest and bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          APK_DIR='upstream/app/build/outputs/apk/debug'
          PREFIX='termux-app_v0.118.3-apt-android-7-sandbox-debug'
          for arch in universal arm64-v8a armeabi-v7a x86_64 x86; do
            apk="$APK_DIR/${PREFIX}_${arch}.apk"
            test -s "$apk"
            unzip -t "$apk" | tail -n 1
            "$ANDROID_HOME/build-tools/30.0.3/apksigner" verify --verbose --print-certs "$apk" > "delivery/${arch}-signature.txt"
            "$ANDROID_HOME/build-tools/30.0.3/zipalign" -c -v 4 "$apk" > "delivery/${arch}-zipalign.txt"
          done
          for arch in arm64-v8a universal; do
            apk="$APK_DIR/${PREFIX}_${arch}.apk"
            "$ANDROID_HOME/build-tools/30.0.3/aapt" dump badging "$apk" > "delivery/${arch}-badging.txt"
            grep -F "package: name='com.termux'" "delivery/${arch}-badging.txt"
            cp "$apk" "delivery/${PREFIX}_${arch}.apk"
          done
          printf 'source=https://github.com/termux/termux-app\nsource_tag=v0.118.3\nsource_commit=5b657c6adf4304e5198951ce815fe0205dcac29c\nvariant=apt-android-7\nbuild=GitHub Actions %s\nvalidation=unzip,apksigner,zipalign,aapt; runtime device NOT RUN\n' "$GITHUB_RUN_ID" > delivery/provenance.txt
          (cd delivery && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload independently built arm64 and universal APKs with evidence
        uses: actions/upload-artifact@v4
        with:
          name: termux-v0.118.3-android7-sandbox-v19
          path: delivery/
          retention-days: 30
          if-no-files-found: error
